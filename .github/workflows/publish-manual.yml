name: Publish to PyPI (manual)

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  build:
    uses: ./.github/workflows/wheel-builder.yml

  publish-pypi:
    name: Publish sdist and wheels to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pygmo
    permissions:
      # Mandatory for trusted publishing. PEP 740 attestations are signed with
      # this same credential and uploaded to PyPI, so they need nothing more.
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pygmo-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
