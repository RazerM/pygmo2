name: Publish to PyPI (manual)

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/wheel-builder.yml

  publish-pypi:
    name: Publish sdist and wheels to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pygmo
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pygmo-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
