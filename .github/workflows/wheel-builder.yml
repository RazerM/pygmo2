name: Wheel Builder

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths: &paths
      - .github/workflows/wheel-builder.yml
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - pygmo/CMakeLists.txt
      - pygmo/plotting/CMakeLists.txt
      - tools/cibw_*
      - vcpkg.json
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        run: pipx run build --sdist
      - name: Check metadata
        run: pipx run twine check dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pygmo-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test_sdist:
    name: Test sdist on ${{ matrix.os }}
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022

    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gfortran autoconf autoconf-archive automake libtool
      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc autoconf autoconf-archive automake libtool

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pygmo-sdist
          path: dist

      - name: Install from the sdist
        shell: bash
        run: python -m pip install dist/*.tar.gz networkx

      # No checkout, so this imports the installed package.
      - name: Run the tests
        run: python -c "import pygmo; pygmo.test.run_test_suite(1); pygmo.mp_island.shutdown_pool(); pygmo.mp_bfe.shutdown_pool()"

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pygmo-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
