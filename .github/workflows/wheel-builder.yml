name: Wheel Builder

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Wheel builds are expensive; the Python CI covers everything else.
  pull_request:
    paths:
      - .github/workflows/wheel-builder.yml
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - pygmo/CMakeLists.txt
      - pygmo/plotting/CMakeLists.txt
      - tools/cibw_*
      - vcpkg.json

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        run: pipx run build --sdist
      - name: Check metadata
        run: pipx run twine check dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pygmo-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test_sdist:
    name: Test sdist on ${{ matrix.os }}
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # What a source build needs beyond a C++ compiler: MUMPS is Fortran, and
      # coin-or-ipopt builds with autotools. On Windows, vcpkg brings its own.
      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gfortran autoconf autoconf-archive automake libtool
      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc autoconf autoconf-archive automake libtool

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pygmo-sdist
          path: dist

      - name: Install from the sdist
        shell: bash
        run: python -m pip install dist/*.tar.gz networkx scipy

      # No checkout, so this imports the installed package.
      - name: Run the tests
        run: python -c "import pygmo; pygmo.test.run_test_suite(1); pygmo.mp_island.shutdown_pool(); pygmo.mp_bfe.shutdown_pool()"

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pygmo-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
