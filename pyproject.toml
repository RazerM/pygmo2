[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pygmo"
dynamic = ["version"]
description = "Parallel optimisation for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "The pagmo development team", email = "pagmo@googlegroups.com" },
]
keywords = [
    "science",
    "math",
    "physics",
    "optimization",
    "ai",
    "evolutionary-computing",
    "parallel-computing",
    "metaheuristics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy", "cloudpickle", "scipy"]

[project.urls]
Homepage = "https://github.com/esa/pygmo2"
Documentation = "https://esa.github.io/pygmo2/"
Changelog = "https://esa.github.io/pygmo2/changelog.html"
Issues = "https://github.com/esa/pygmo2/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# pygmo/CMakeLists.txt installs the Python files itself; auto-discovery would
# additionally copy the C++ sources sitting next to them into the wheel.
wheel.packages = []

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?m)^project\(pygmo VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'''

[tool.scikit-build.sdist]
exclude = [".github", ".clang-format", ".gitignore", "doc/_build", "doc/images"]

[tool.cibuildwheel]
skip = ["cp3??t-*", "*-musllinux_*"]
test-requires = ["networkx"]
test-command = 'python -c "import pygmo; pygmo.test.run_test_suite(1); pygmo.mp_island.shutdown_pool(); pygmo.mp_bfe.shutdown_pool()"'

[tool.cibuildwheel.linux]
before-all = "yum install -y zip unzip"
test-requires = ["ipyparallel", "networkx"]
test-command = "bash {project}/tools/cibw_test_linux.sh"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# A fixed vcpkg install directory gives delvewheel a known place to find the
# DLLs, and lets every Python version's build share it. delvewheel vendors the
# DLLs, so pygmo does not install its own copies.
config-settings = { "cmake.define.VCPKG_INSTALLED_DIR" = "C:/pygmo_vcpkg_installed", "cmake.define.PYGMO_VCPKG_INSTALL_DLLS" = "OFF" }
repair-wheel-command = "delvewheel repair --add-path C:/pygmo_vcpkg_installed/x64-windows/bin -w {dest_dir} -v {wheel}"
